<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>水源深度搜索</title>
  <link rel="stylesheet" href="common.css">
  <style>
    #progress { max-height: 380px; overflow-y: auto; }
    #chat { max-height: 480px; overflow-y: auto; }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="page">
      <div class="logo">源</div>
      <h1>水源深度搜索</h1>
      <span class="sub">多智能体 · 同义词扩展 · 线索发掘</span>
      <div class="spacer"></div>
      <a href="setup.html" class="iconlink" title="设置">⚙</a>
    </header>

    <div id="notice" class="msg err hidden"></div>

    <section class="card">
      <div class="searchbar">
        <input type="text" id="q" placeholder="输入你想深入了解的话题，例如：食堂涨价 / 保研政策变化 / 校园网 IPv6 …">
        <button id="btn-go">深度搜索</button>
      </div>
      <div class="opts">
        <span>并行 agent 数
          <select id="opt-agents"><option>2</option><option selected>4</option><option>6</option></select>
        </span>
        <span>发掘轮数
          <select id="opt-rounds"><option>1</option><option selected>2</option><option>3</option></select>
        </span>
        <span>每个 agent 精读主题数
          <select id="opt-topics"><option>1</option><option selected>2</option><option>3</option></select>
        </span>
        <button id="btn-stop" class="secondary hidden">停止</button>
        <span id="phase-badge" class="status warn hidden"></span>
      </div>
      <div id="run-topic"></div>
    </section>

    <section id="progress-box" class="card hidden">
      <h2>搜索进度</h2>
      <div id="progress"></div>
    </section>

    <section id="report-box" class="card hidden">
      <h2>深度搜索报告</h2>
      <div id="report"></div>
      <div id="report-meta" class="hint"></div>
    </section>

    <section id="chat-box" class="card hidden">
      <h2>追问</h2>
      <p class="hint">基于本次搜索的全部材料继续提问；材料不足时会自动追加论坛搜索。</p>
      <div id="chat"></div>
      <div id="chat-status" class="hidden"></div>
      <div class="chat-inputrow">
        <input type="text" id="chat-q" placeholder="就这次搜索继续追问…">
        <button id="btn-ask">追问</button>
      </div>
    </section>

    <section class="card">
      <h2>历史记录</h2>
      <div id="history-list"></div>
    </section>
  </div>
  <script type="module" src="search.js"></script>
</body>
</html>
